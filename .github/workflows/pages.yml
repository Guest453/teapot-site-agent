name: Deploy site to GitHub Pages

# kristal web source includes the love.js module-loading fix from dee7283
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout teapot site
        uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: prepare unchanged main site
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          cp -a site/. "$RUNNER_TEMP/pages/"

      - name: fetch separate kristal web project
        run: |
          git clone --depth 1 --branch main https://github.com/Guest453/birdvirus-kristal-mod.git "$RUNNER_TEMP/birdvirus-kristal-mod"
          git -C "$RUNNER_TEMP/birdvirus-kristal-mod" log -1 --oneline

      - name: verify love.js page uses a shared module variable
        working-directory: ${{ runner.temp }}/birdvirus-kristal-mod
        run: |
          grep -q 'var Module = {' web/index.template.html
          if grep -q 'const Module' web/index.template.html; then
            echo "invalid const Module declaration found"
            exit 1
          fi

      - name: build kristal web separately
        working-directory: ${{ runner.temp }}/birdvirus-kristal-mod
        run: |
          npm install --no-audit --no-fund
          npm run build:web

      - name: add kristal only to temporary pages artifact
        run: |
          mkdir -p "$RUNNER_TEMP/pages/kristal"
          cp -a "$RUNNER_TEMP/birdvirus-kristal-mod/dist/." "$RUNNER_TEMP/pages/kristal/"
          touch "$RUNNER_TEMP/pages/.nojekyll"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v4
