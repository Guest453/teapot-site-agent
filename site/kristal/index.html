<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#07060d">
    <title>Birdvirus — Kristal Web</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="background" aria-hidden="true"></div>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">kristal web</p>
          <h1>birdvirys</h1>
        </div>
        <div class="actions">
          <button id="fullscreen" type="button">fullscreen</button>
          <button id="reload" type="button">reload</button>
        </div>
      </header>

      <section class="game-frame" aria-label="birdvirys game">
        <canvas id="loadingCanvas" width="640" height="480" aria-label="loading screen"></canvas>
        <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
      </section>

      <footer>
        <span id="status">starting love.js…</span>
        <span>project id: Birdvirus</span>
      </footer>
    </main>

    <script>
      const canvas = document.getElementById("canvas");
      const loadingCanvas = document.getElementById("loadingCanvas");
      const loadingContext = loadingCanvas.getContext("2d");
      const statusText = document.getElementById("status");

      function drawLoadingText(text) {
        const width = loadingCanvas.width;
        const height = loadingCanvas.height;
        loadingContext.fillStyle = "#06050b";
        loadingContext.fillRect(0, 0, width, height);
        loadingContext.textAlign = "center";
        loadingContext.fillStyle = "#ffffff";
        loadingContext.font = "bold 28px monospace";
        loadingContext.fillText("KRISTAL WEB", width / 2, height / 2 - 22);
        loadingContext.fillStyle = "#9d8cff";
        loadingContext.font = "16px monospace";
        loadingContext.fillText(text || "loading…", width / 2, height / 2 + 18);
      }

      window.addEventListener("load", () => canvas.focus());
      window.addEventListener("click", () => canvas.focus());
      window.addEventListener("keydown", (event) => {
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(event.key)) {
          event.preventDefault();
        }
      }, { passive: false });

      document.getElementById("reload").addEventListener("click", () => location.reload());
      document.getElementById("fullscreen").addEventListener("click", async () => {
        try {
          if (!document.fullscreenElement) await document.querySelector(".game-frame").requestFullscreen();
          else await document.exitFullscreen();
          canvas.focus();
        } catch (error) {
          console.error(error);
        }
      });

      const Module = {
        arguments: ["./game.love"],
        INITIAL_MEMORY: 536870912,
        print: console.log.bind(console),
        printErr: console.error.bind(console),
        canvas,
        setStatus(text) {
          if (text) {
            statusText.textContent = text;
            drawLoadingText(text);
          } else if (Module.remainingDependencies === 0) {
            loadingCanvas.hidden = true;
            canvas.style.visibility = "visible";
            statusText.textContent = "running";
            canvas.focus();
          }
        },
        totalDependencies: 0,
        remainingDependencies: 0,
        monitorRunDependencies(left) {
          this.remainingDependencies = left;
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? `loading ${this.totalDependencies - left}/${this.totalDependencies}` : "starting game…");
        },
      };

      Module.setStatus("downloading game…");
      window.onerror = function (event) {
        console.error(event);
        statusText.textContent = "crashed — open the browser console";
      };

      function applicationLoad() {
        Love(Module);
      }
    </script>
    <script src="game.js"></script>
    <script async src="love.js" onload="applicationLoad()"></script>
  </body>
</html>
